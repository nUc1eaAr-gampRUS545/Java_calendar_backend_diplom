services:
  app:
#    image: '8f9fd8bacd38'
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring_application
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      - db
    environment:
       DB_USER: postgres
       DB_URL: jdbc:postgresql://db:5432/Java_calendar
       DB_PASSWORD: qwerty


  db:
    image: 'postgres:13'
    container_name: db
    environment:
      POSTGRES_DB: Java_calendar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: